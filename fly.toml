# Fly.io config for the ephemeral room server.
#
#   fly launch --no-deploy --copy-config --name <unique-app-name>
#   fly deploy
#
# Change `app` to a globally unique name. Keep exactly one machine running:
# rooms live in that process's memory, so a second machine would have a
# different set of room codes.
app = "farkle-online-mathieu"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.server"

[env]
  PORT = "8787"
  ALLOWED_ORIGINS = "https://farkle.mathieu.cc"
  MAX_ROOMS = "500"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
