name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @farkle/web build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://farkle-online.mathieu.cc' }}

      # GitHub Pages serves 404.html for unknown paths; the shell boots the SPA
      # from there so deep links such as /local/game and /join/5T1S work.
      - name: Add the SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
